# Release PRs, tags and CHANGELOG.md from Conventional Commits (release-please), then the
# package publish to GitHub Packages when a release was created. Call form documented in
# the headers of release.yml and publish.yml of meteo-consensus/.github at v0.1.1.
# Only the publish call is granted `packages: write`.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    uses: meteo-consensus/.github/.github/workflows/release.yml@0827d7dbbc9550ff61f0f6e147bfac64f26b6d23 # v0.1.1
    permissions:
      contents: write
      pull-requests: write
  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: meteo-consensus/.github/.github/workflows/publish.yml@0827d7dbbc9550ff61f0f6e147bfac64f26b6d23 # v0.1.1
    permissions:
      contents: read
      packages: write
